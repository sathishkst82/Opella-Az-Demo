name: terraform-destroy-plan

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      branch:
        type: string
        required: true
      tf_use_extra_args:
        type: boolean
        required: false
        default: false

jobs:
  destroy_plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform Init
        run: |
          terraform -chdir=environments/${{ lower(inputs.environment) }} init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"
      - name: Terraform Destroy Plan
        run: |
          EXTRA=""
          if [ "${{ inputs.tf_use_extra_args }}" = "true" ] && [ -n "${{ secrets.EXTRA_ARGS }}" ]; then
            EXTRA="${{ secrets.EXTRA_ARGS }}"
          fi
          terraform -chdir=environments/${{ lower(inputs.environment) }} plan -destroy -out=tfdestroy $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: tfdestroy-${{ inputs.environment }}
          path: environments/${{ lower(inputs.environment) }}/tfdestroy
