name: terraform-destroy-plan

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      branch:
        type: string
        required: true
      tf_use_extra_args:
        type: boolean
        required: false
        default: false

jobs:
  destroy_plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
      TF_VAR_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
      ENV_DIR: terraform-azure-platform/environments/${{ fromJSON('{"DEV":"dev","UAT":"uat","PROD":"prod"}')[inputs.environment] }}
      PLAN_FILE: tfdestroy-${{ inputs.environment }}.bin
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.ENV_DIR }} init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"
      - name: Terraform Destroy Plan
        run: |
          EXTRA=""
          if [ "${{ inputs.tf_use_extra_args }}" = "true" ] && [ -n "${{ secrets.EXTRA_ARGS }}" ]; then
            EXTRA="${{ secrets.EXTRA_ARGS }}"
          fi
          terraform -chdir=${{ env.ENV_DIR }} plan -input=false -lock-timeout=5m -destroy -out="${{ env.PLAN_FILE }}" $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: tfdestroy-${{ inputs.environment }}
          path: ${{ env.ENV_DIR }}/${{ env.PLAN_FILE }}
