name: terraform-plan
on: {workflow_call: {inputs: {environment: {type: string, required: true}, branch: {type: string, required: true}, tf_use_extra_args: {type: boolean, required: false, default: false}}}}
jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions: {id-token: write, contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: {client-id: ${{ vars.AZURE_CLIENT_ID }}, tenant-id: ${{ vars.AZURE_TENANT_ID }}, subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}}
      - run: terraform -chdir=environments/${{ lower(inputs.environment) }} init -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"
      - run: terraform -chdir=environments/${{ lower(inputs.environment) }} validate
      - run: tflint --init && tflint --recursive
      - run: wizcli auth --id ${{ secrets.WIZ_CLIENT_ID }} --secret ${{ secrets.WIZ_CLIENT_SECRET }} && wizcli iac scan --path .
      - run: terraform -chdir=environments/${{ lower(inputs.environment) }} plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with: {name: tfplan-${{ inputs.environment }}, path: environments/${{ lower(inputs.environment) }}/tfplan}
