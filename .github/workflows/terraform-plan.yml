name: terraform-plan

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      branch:
        type: string
        required: true
      tf_use_extra_args:
        type: boolean
        required: false
        default: false
      tf_lock_id:
        type: string
        required: false
      tf_import_id:
        type: string
        required: false
      tf_import_name:
        type: string
        required: false
      tf_remove_name:
        type: string
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
      TF_VAR_admin_password: ${{ secrets.WINDOWS_ADMIN_PASSWORD }}
      PROJECT_DIR: terraform-azure-platform
      ENV_DIR: terraform-azure-platform/environments/${{ fromJSON('{"DEV":"dev","UAT":"uat","PROD":"prod"}')[inputs.environment] }}
      PLAN_FILE: tfplan-${{ inputs.environment }}.bin
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Install TFLint
        run: curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Open storage firewall for CI refresh
        run: |
          ENV_NAME=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          RESOURCE_GROUP="rg-sathish-${ENV_NAME}-eastus"
          STORAGE_ACCOUNT="stsathish${ENV_NAME}eus001"

          if az storage account show --resource-group "$RESOURCE_GROUP" --name "$STORAGE_ACCOUNT" >/dev/null 2>&1; then
            az storage account update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$STORAGE_ACCOUNT" \
              --public-network-access Enabled \
              --default-action Allow
          else
            echo "Storage account $STORAGE_ACCOUNT does not exist yet; skipping firewall preflight."
          fi
      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.ENV_DIR }} init -input=false \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"
      - name: Terraform Validate
        run: terraform -chdir=${{ env.ENV_DIR }} validate
      - name: TFLint
        run: tflint --init && tflint --chdir=${{ env.ENV_DIR }}
      - name: Wiz IaC Scan
        if: ${{ vars.ENABLE_WIZ_SCAN == 'true' }}
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          if [ -z "$WIZ_CLIENT_ID" ] || [ -z "$WIZ_CLIENT_SECRET" ]; then
            echo "ENABLE_WIZ_SCAN is true, but Wiz credentials are not configured."
            exit 1
          fi
          curl -o wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli
          sudo mv wizcli /usr/local/bin/wizcli
          wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
          wizcli iac scan --path ${{ env.PROJECT_DIR }} --policy-hits-only
      - name: Optional state operations
        run: |
          if [ -n "${{ inputs.tf_lock_id }}" ]; then
            terraform -chdir=${{ env.ENV_DIR }} force-unlock -force "${{ inputs.tf_lock_id }}"
          fi
          if [ -n "${{ inputs.tf_import_name }}" ] && [ -n "${{ inputs.tf_import_id }}" ]; then
            terraform -chdir=${{ env.ENV_DIR }} import "${{ inputs.tf_import_name }}" "${{ inputs.tf_import_id }}"
          fi
          if [ -n "${{ inputs.tf_remove_name }}" ]; then
            terraform -chdir=${{ env.ENV_DIR }} state rm "${{ inputs.tf_remove_name }}"
          fi
      - name: Terraform Plan
        timeout-minutes: 30
        run: |
          EXTRA=""
          if [ "${{ inputs.tf_use_extra_args }}" = "true" ] && [ -n "${{ secrets.EXTRA_ARGS }}" ]; then
            EXTRA="${{ secrets.EXTRA_ARGS }}"
          fi
          terraform -chdir=${{ env.ENV_DIR }} plan -input=false -lock-timeout=5m -out="${{ env.PLAN_FILE }}" $EXTRA
          terraform -chdir=${{ env.ENV_DIR }} show -no-color "${{ env.PLAN_FILE }}" > plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: |
            ${{ env.ENV_DIR }}/${{ env.PLAN_FILE }}
            ${{ env.ENV_DIR }}/plan.txt
