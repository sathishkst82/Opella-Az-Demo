name: docs-validation
on: [pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f terraform-azure-platform/README.md && test -f terraform-azure-platform/docs/environment-setup.md && test -f terraform-azure-platform/docs/oidc-setup.md && test -f terraform-azure-platform/docs/assessment-guide.md
