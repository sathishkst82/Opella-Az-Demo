name: terraform-apply
on: {workflow_call: {inputs: {environment: {type: string, required: true}, branch: {type: string, required: true}}}}
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: {client-id: ${{ vars.AZURE_CLIENT_ID }}, tenant-id: ${{ vars.AZURE_TENANT_ID }}, subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }} }
      - run: terraform -chdir=environments/${{ lower(inputs.environment) }} init -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"
      - run: terraform -chdir=environments/${{ lower(inputs.environment) }} apply -auto-approve
