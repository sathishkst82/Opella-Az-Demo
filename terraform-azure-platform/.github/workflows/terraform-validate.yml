name: Terraform Validate

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      branch: { type: string, required: true }
      tf_lock_id: { type: string, required: false }
      tf_import_id: { type: string, required: false }
      tf_import_name: { type: string, required: false }
      tf_remove_name: { type: string, required: false }
      tf_use_extra_args: { type: boolean, required: false, default: false }

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
      ENV_DIR: environments/${{ fromJSON('{"DEV":"dev","UAT":"uat","PROD":"prod"}')[inputs.environment] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install terraform-docs and tflint
        run: |
          curl -sSLo terraform-docs.tar.gz https://terraform-docs.io/dl/v0.18.0/terraform-docs-v0.18.0-linux-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Terraform fmt
        run: terraform fmt -recursive -check

      - name: Terraform init
        working-directory: ${{ env.ENV_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}"

      - name: Optional state operations
        working-directory: ${{ env.ENV_DIR }}
        run: |
          if [ -n "${{ inputs.tf_lock_id }}" ]; then terraform force-unlock -force "${{ inputs.tf_lock_id }}"; fi
          if [ -n "${{ inputs.tf_remove_name }}" ]; then terraform state rm "${{ inputs.tf_remove_name }}"; fi
          if [ -n "${{ inputs.tf_import_id }}" ] && [ -n "${{ inputs.tf_import_name }}" ]; then terraform import "${{ inputs.tf_import_name }}" "${{ inputs.tf_import_id }}"; fi

      - name: Terraform validate
        working-directory: ${{ env.ENV_DIR }}
        run: terraform validate

      - name: terraform-docs validation
        run: |
          terraform-docs markdown table modules/vnet >/tmp/vnet.md
          terraform-docs markdown table modules/vm >/tmp/vm.md
          terraform-docs markdown table modules/storage >/tmp/storage.md
          terraform-docs markdown table modules/governance >/tmp/governance.md

      - name: TFLint
        run: |
          tflint --init
          tflint --chdir=${{ env.ENV_DIR }}
