name: IaC Dispatch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [DEV, UAT, PROD]
      branch:
        description: Branch/ref to run against
        type: string
        default: main
        required: true
      action:
        description: Terraform action
        type: choice
        required: true
        options: [validate, plan, plan-apply, destroy-plan, destroy-apply]
      tf_lock_id:
        description: Optional Terraform lock ID to force-unlock before init
        type: string
        required: false
      tf_import_id:
        description: Optional Terraform resource ID to import
        type: string
        required: false
      tf_import_name:
        description: Optional Terraform resource address to import
        type: string
        required: false
      tf_remove_name:
        description: Optional Terraform state address to remove
        type: string
        required: false
      tf_use_extra_args:
        description: Append EXTRA_ARGS environment secret to Terraform commands
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  actions: read

jobs:
  validate:
    if: inputs.action == 'validate'
    uses: ./.github/workflows/terraform-validate.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
      tf_lock_id: ${{ inputs.tf_lock_id }}
      tf_import_id: ${{ inputs.tf_import_id }}
      tf_import_name: ${{ inputs.tf_import_name }}
      tf_remove_name: ${{ inputs.tf_remove_name }}
      tf_use_extra_args: ${{ inputs.tf_use_extra_args }}
    secrets: inherit

  plan:
    if: inputs.action == 'plan'
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
      tf_lock_id: ${{ inputs.tf_lock_id }}
      tf_import_id: ${{ inputs.tf_import_id }}
      tf_import_name: ${{ inputs.tf_import_name }}
      tf_remove_name: ${{ inputs.tf_remove_name }}
      tf_use_extra_args: ${{ inputs.tf_use_extra_args }}
    secrets: inherit

  plan_apply_plan:
    if: inputs.action == 'plan-apply'
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
      tf_lock_id: ${{ inputs.tf_lock_id }}
      tf_import_id: ${{ inputs.tf_import_id }}
      tf_import_name: ${{ inputs.tf_import_name }}
      tf_remove_name: ${{ inputs.tf_remove_name }}
      tf_use_extra_args: ${{ inputs.tf_use_extra_args }}
    secrets: inherit

  plan_apply_apply:
    if: inputs.action == 'plan-apply'
    needs: plan_apply_plan
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
    secrets: inherit

  destroy_plan:
    if: inputs.action == 'destroy-plan'
    uses: ./.github/workflows/terraform-destroy-plan.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
      tf_lock_id: ${{ inputs.tf_lock_id }}
      tf_use_extra_args: ${{ inputs.tf_use_extra_args }}
    secrets: inherit

  destroy_apply_plan:
    if: inputs.action == 'destroy-apply'
    uses: ./.github/workflows/terraform-destroy-plan.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
      tf_lock_id: ${{ inputs.tf_lock_id }}
      tf_use_extra_args: ${{ inputs.tf_use_extra_args }}
    secrets: inherit

  destroy_apply:
    if: inputs.action == 'destroy-apply'
    needs: destroy_apply_plan
    uses: ./.github/workflows/terraform-destroy-apply.yml
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.branch }}
    secrets: inherit
