name: Docs Validation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "modules/**/README.md"
      - ".github/workflows/docs-validation.yml"

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          test -f README.md
          test -f docs/environment-setup.md
          test -f docs/oidc-setup.md
          test -f docs/github-environments.md
          test -f docs/interview-talking-points.md
          grep -q "Architecture Overview" README.md
